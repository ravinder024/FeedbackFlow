<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FeedbackFlow Demo Sample</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9fafb; }
    header { background: #4f46e5; color: white; padding: 1.5rem; text-align: center; }
    main { padding: 2rem; }
    .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 2rem; margin-bottom: 2rem; }
    button { background: #4f46e5; color: white; border: none; border-radius: 4px; padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; }
    button:hover { background: #4338ca; }
    input, textarea { border: 1px solid #d1d5db; border-radius: 4px; padding: 0.5rem; width: 100%; margin-bottom: 1rem; }
  </style>
  <!-- Load demo feedback widget -->
  <script src="/widget/demo-feedback.js" defer></script>
</head>
<body>
  <header>
    <h1>FeedbackFlow Demo Sample Page</h1>
  </header>
  <main>
    <div class="card">
      <h2>Welcome to the Demo</h2>
      <p>This is a sample page for testing the FeedbackFlow widget. Try placing pins, masking fields, and submitting feedback.</p>
      <button>Sample Button</button>
    </div>
    <div class="card">
      <h2>Contact Us</h2>
      <form>
        <input type="text" placeholder="Your Name" />
        <input type="email" placeholder="Your Email" />
        <input type="password" placeholder="Password" />
        <textarea placeholder="Your message"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </main>

</body>
</html>
